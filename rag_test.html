<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chorus Conversational RAG Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #111827;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header button {
      background: #374151;
      color: #fff;
      border: 1px solid #4b5563;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    header button:hover { background: #4b5563; }
    #chatFeed {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .msg { display: flex; flex-direction: column; max-width: 85%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; width: 100%; }
    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .msg.user .bubble {
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: #fff;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .products-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 12px;
      width: 100%;
      margin-top: 12px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }
    .card img {
      width: 100%;
      height: 130px;
      object-fit: contain;
      background: #fff;
      border-radius: 6px;
    }
    .card .brand { color: #6b7280; font-size: 11px; text-transform: uppercase; }
    .card .title {
      font-weight: 600;
      color: #111827;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card .price { color: #059669; font-weight: 700; font-size: 14px; margin-top: auto; }
    .input-bar {
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 14px 24px;
    }
    .input-wrap {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }
    #chatInput {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }
    #chatInput:focus { border-color: #2563eb; }
    #sendBtn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    #sendBtn:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Chorus AI assistant</h1>
    <button onclick="resetSession()">Reset Session</button>
  </header>

  <div id="chatFeed">
    <div class="msg assistant">
      <div class="bubble">Hey ! How can I help you ? Ask for any product recommonedations.</div>
    </div>
  </div>

  <div class="input-bar">
    <div class="input-wrap">
      <input
        id="chatInput"
        type="text"
        placeholder="Ask a shopping question or follow-up..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
      />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let chatHistory = [];
    let currentTopic = "";

    const STOP_WORDS = new Set([
      "i", "want", "need", "a", "an", "the", "to", "for", "my", "myself", "me",
      "please", "can", "you", "show", "suggest", "find", "give", "get", "looking",
      "some", "any", "type", "of", "good", "best", "buy", "is", "are", "who", "years", "old"
    ]);

    function resetSession() {
      chatHistory = [];
      currentTopic = "";
      document.getElementById("chatFeed").innerHTML = `
        <div class="msg assistant">
          <div class="bubble">Session cleared! Ask a new shopping question to start fresh.</div>
        </div>
      `;
    }

    function extractCoreKeywords(text) {
      const cleaned = text.toLowerCase()
        .replace(/\bbycycle\b/g, "bicycle bike")
        .replace(/\bstudy table\b/g, "study table computer writing desk")
        .replace(/[^\w\s]/g, " ");
      const tokens = cleaned.split(/\s+/).filter(w => w.length > 1 && !STOP_WORDS.has(w));
      return tokens.length > 0 ? tokens.join(" ") : text;
    }

    function isFollowUpMessage(text) {
      if (chatHistory.length === 0) return false;
      const lower = text.toLowerCase().trim();
      const newSearchStarters = /^(show me|suggest|find|search|i want|i need|looking for|gift for|buy|get me)\b/;
      const followUpCues = /\b(but|instead|which|that|those|these|it|them|one|first|second|third|fourth|#1|#2|#3|#4|cheaper|expensive|better|other|more|why|what about|how about)\b/;

      if (newSearchStarters.test(lower) && !/\b(instead|other|another|different)\b/.test(lower)) {
        return false;
      }
      return followUpCues.test(lower);
    }

    function humaniseOutput(rawText) {
      return (rawText || "")
        .replace(/SEARCH RESULT \d+:\s*/gi, "• ")
        .replace(/\b(Item|Title):\s*/gi, "")
        .trim();
    }

    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const btn = document.getElementById("sendBtn");
      const feed = document.getElementById("chatFeed");
      const userText = input.value.trim();
      if (!userText) return;

      input.value = "";
      btn.disabled = true;

      const userDiv = document.createElement("div");
      userDiv.className = "msg user";
      userDiv.innerHTML = `<div class="bubble"></div>`;
      userDiv.querySelector(".bubble").textContent = userText;
      feed.appendChild(userDiv);

      const botDiv = document.createElement("div");
      botDiv.className = "msg assistant";
      botDiv.innerHTML = `<div class="bubble">Finding the best matches for you...</div>`;
      feed.appendChild(botDiv);
      feed.scrollTop = feed.scrollHeight;

      const isFollowUp = isFollowUpMessage(userText);
      const coreQuery = extractCoreKeywords(userText);

      if (!isFollowUp) {
        currentTopic = coreQuery;
      } else {
        currentTopic = `${currentTopic} ${coreQuery}`;
      }

      const lastTurn = chatHistory.length > 0 ? chatHistory[chatHistory.length - 1] : null;
      const contextualQuestion = (isFollowUp && lastTurn)
        ? `Shopper's earlier request: "${lastTurn.user}" (Products shown: ${lastTurn.products}). Shopper's follow-up: "${userText}". Respond conversationally like a helpful human store assistant.`
        : `Shopper says: "${userText}". Respond conversationally in 2-4 friendly sentences recommending the best matching items from the context (or politely suggest the closest alternative from the context if their exact item isn't available).`;

      const payload = {
        size: 4,
        query: {
          hybrid: {
            queries: [
              {
                multi_match: {
                  query: currentTopic,
                  type: "best_fields",
                  fuzziness: "AUTO",
                  fields: ["title^4", "category^3", "bullet_points^2", "brand^2", "description"]
                }
              },
              {
                neural: {
                  title_embedding: {
                    query_text: currentTopic,
                    k: 10
                  }
                }
              }
            ]
          }
        },
        ext: {
          generative_qa_parameters: {
            llm_model: "gpt-3.5-turbo",
            llm_question: contextualQuestion,
            context_size: 4,
            timeout: 180
          }
        }
      };

      try {
        const res = await fetch("http://localhost:9090/ecommerce/_search?search_pipeline=rag_pipeline", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        const rawAnswer = data?.ext?.retrieval_augmented_generation?.answer;
        const hits = data?.hits?.hits || [];

        if (rawAnswer) {
          botDiv.querySelector(".bubble").textContent = humaniseOutput(rawAnswer);
        } else {
          botDiv.querySelector(".bubble").textContent = "⚠️ Error:\n" + JSON.stringify(data.error || data, null, 2);
        }

        if (hits.length > 0) {
          const row = document.createElement("div");
          row.className = "products-row";
          hits.forEach((hit, i) => {
            const s = hit._source || {};
            const imgUrl = s.image_url || s.image || "";
            const price = s.price ? `$${Number(s.price).toFixed(2)}` : "Price N/A";
            const rating = s.rating ? `⭐ ${s.rating}` : "";
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              ${imgUrl ? `<img src="${imgUrl}" alt="" />` : ""}
              <div class="brand">#${i + 1} • ${s.brand || "Product"} ${rating}</div>
              <div class="title">${s.title || s.asin}</div>
              <div class="price">${price}</div>
            `;
            row.appendChild(card);
          });
          botDiv.appendChild(row);
        }

        if (rawAnswer) {
          const productSummary = hits.map((h, i) => {
            const s = h._source || {};
            return `#${i + 1} ${s.title || ""} ($${s.price ?? "N/A"})`;
          }).join("; ");

          chatHistory.push({
            user: userText,
            products: productSummary
          });
        }
      } catch (err) {
        botDiv.querySelector(".bubble").textContent = "Request failed: " + err.message;
      } finally {
        btn.disabled = false;
        feed.scrollTop = feed.scrollHeight;
        input.focus();
      }
    }
  </script>
</body>
</html>
